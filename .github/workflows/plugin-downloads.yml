name: Snapshot plugin downloads

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  snapshot:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record download totals
        run: node .github/scripts/snapshot-plugin-downloads.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        id: commit
        run: |
          git add public/data/plugin-downloads.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update plugin download counts"
          # The CMS also commits to main, so retry if one lands while this runs.
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 10
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN don't trigger deploy.yml, but workflow_dispatch does.
      - name: Deploy
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
